# models/marts/_marts__models.yml
version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null